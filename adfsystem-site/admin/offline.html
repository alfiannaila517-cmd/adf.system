<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <title>Offline — ADF Admin</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0e14; color: #e5e7eb; font-family: -apple-system, system-ui, sans-serif; padding: 24px; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 14px; }
        h1 { font-size: 18px; margin: 0 0 6px; }
        p { font-size: 14px; color: #9ca3af; margin: 0 0 18px; line-height: 1.5; }
        button { background: #ff6b1a; color: #fff; border: 0; border-radius: 10px; padding: 11px 22px; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div>
        <img src="app-icons/icon-192.png" alt="">
        <h1>Tidak ada koneksi internet</h1>
        <p>Periksa koneksi HP Anda, lalu coba lagi.</p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
