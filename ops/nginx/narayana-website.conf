# Website publik Narayana (folder website/public dari kode sistem lama yang sama) — terjemahan .htaccess.production.
# Dipasang lewat:  sudo bash /srv/adf/app/ops/add-website.sh <domain> [--test]
#   uji sekarang : web-staging.adfsystem.online (A record di Cloudflare → VPS), website/config/secrets.php berisi
#                  ADF_SYSTEM_URL = https://staging.adfsystem.online (notifikasi pesanan uji tidak masuk sistem live)
#   hari pindahan: narayanakarimunjawa.com + www, hapus ADF_SYSTEM_URL dari secrets (kembali ke adfsystem.online)

server {
    listen 80;
    listen [::]:80;
    server_name web-staging.adfsystem.online;

    root /srv/adf/legacy/public_html/website/public;
    index index.php index.html;
    autoindex off;
    client_max_body_size 16M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ { allow all; }

    # Larangan (.htaccess: config/ logs/ + file sql/log/env/git/md, file tersembunyi)
    location ~ ^/(config|logs)/ { deny all; }
    location ~* \.(sql|log|env|git|md)$ { deny all; }
    location ~ /\. { deny all; }

    # Upload pengunjung tidak boleh dijalankan sebagai PHP
    location ~* ^/uploads/.*\.php$ { deny all; }

    location ~* \.(jpe?g|png|gif|webp|svg|ico|css|js|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 120;
    }

    # Alamat tanpa .php (rooms → rooms.php), seperti RewriteRule hosting
    location / {
        try_files $uri $uri/ $uri.php$is_args$args;
    }
}
