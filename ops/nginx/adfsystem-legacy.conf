# ADF System lama (kode branch main, apa adanya) di VPS — terjemahan .htaccess hosting ke Nginx.
# Pasang:  sudo cp ops/nginx/adfsystem-legacy.conf /etc/nginx/sites-available/adfsystem-legacy
#          sudo ln -s /etc/nginx/sites-available/adfsystem-legacy /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d staging.adfsystem.online
# Saat pindah rumah: tambah adfsystem.online www.adfsystem.online di server_name lalu certbot lagi.
#
# Struktur meniru cPanel: /srv/adf/legacy = "home" (file rahasia di luar web: adf-google-oauth.php, adf-sso-*.json, …)
#                         /srv/adf/legacy/public_html = kode (root web)

server {
    listen 80;
    listen [::]:80;
    server_name staging.adfsystem.online;

    root /srv/adf/legacy/public_html;
    index index.php index.html;
    autoindex off;
    client_max_body_size 64M;   # developer/.user.ini: post_max_size 60M
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt
    location ^~ /.well-known/acme-challenge/ { allow all; }

    # ---- Larangan (urutan penting: regex dicek berurutan, harus sebelum blok PHP) ----

    # File/folder tersembunyi: .git .env .cpanel.yml .user.ini .htaccess .venv .vscode .ftpquota
    location ~ /\. { deny all; }

    # Folder internal (Apache: RewriteRule … [F]); tmp_sessions = file sesi login (baru dikunci di sini)
    location ~ ^/(config|cron|backups|database|sql|docs|deploy|tools|test|examples|vendor|tmp_sessions|adfsystem-site|adfsystem.store|website|website-sunsea|narayanakarimunjawa\.com)(/|$) { deny all; }

    # Jenis file yang tidak boleh diunduh, di folder mana pun
    location ~* \.(sql|gz|md|sh|ya?ml|lock|env|log|bak|backup|phar|ini)$ { deny all; }
    location ~ (^|/)(error_log|composer\.(json|lock|phar))$ { deny all; }

    # Skrip perawatan di folder mana pun (Apache FilesMatch). CATATAN: update-* dan check-* TIDAK diblok di subfolder —
    # api/update-reservation.php, api/check-duplicate-transaction.php dll. dipakai menu harian.
    location ~ (^|/)(fix|debug|diag|diagnose|diagnostic|test|setup)-[^/]*\.(php|html)$ { deny all; }
    location ~ (^|/)(phpinfo|php-check|emergency-deploy|test-cloudinary-upload)\.php$ { deny all; }

    # Skrip perawatan di root saja
    location ~ ^/(_[^/]*|update-[^/]*|check-[^/]*|cleanup-[^/]*|force-deploy[^/]*|insert-[^/]*|create-[^/]*|[^/]*-diagnostic|config-pwf[^/]*|travel-bureau-fix|standalone-export|sync|developer-access|webhook-deploy|adfstore-update|_deploy_fingerprint_cron)\.php$ { deny all; }

    # Alat developer berbahaya
    location ~ ^/developer/(reveal-password|debug-business-status)\.php$ { deny all; }

    # Upload: tidak boleh ada skrip yang dijalankan (cegah upload → eksekusi)
    location ~* ^/uploads/.*\.(php\d?|phtml|phar|pht|phps|cgi|pl|py|sh|asp|aspx|jsp)$ { deny all; }

    # ---- Rute ----

    # /admin → halaman login staf (Apache: RewriteRule ^admin/?$ login.php?view=system [L,QSA])
    location ~ ^/admin/?$ { rewrite ^ /login.php?view=system last; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;          # try_files $fastcgi_script_name =404 + HTTPS diteruskan
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 300;                   # developer/.user.ini: max_execution_time 300
    }
}
