# Website jualan adfsystem.store di VPS — terjemahan .htaccess hosting ke Nginx.
#
# Struktur SAMA dengan hosting (kode tidak perlu diubah):
#   /srv/adf/legacy                                  = "home" (file rahasia: adf-google-oauth.php, adf-sso-secret.php, adf-telegram.php)
#   /srv/adf/legacy/public_html/adfsystem.store      = website (salinan folder live dari hosting, termasuk data/*.json)
#   (folder itu sudah di-.gitignore repo, jadi git pull sistem lama tidak menyentuhnya; developer panel lama
#    membacanya di path yang sama seperti di hosting — adfstore_bridge.php)
#
# Pasang:  sudo cp ops/nginx/adfsystem-store.conf /etc/nginx/sites-available/adfsystem-store
#          sudo ln -s /etc/nginx/sites-available/adfsystem-store /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          (setelah DNS adfsystem.store mengarah ke VPS) sudo certbot --nginx -d adfsystem.store -d www.adfsystem.store

server {
    listen 80;
    listen [::]:80;
    server_name adfsystem.store www.adfsystem.store;

    root /srv/adf/legacy/public_html/adfsystem.store;
    index index.php index.html;
    autoindex off;
    client_max_body_size 32M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt
    location ^~ /.well-known/acme-challenge/ { allow all; }

    # adfsystem.store/console → ADF Console (tetap di console.adfsystem.store: link invoice, API langganan
    # tenant & login Google sudah memakai alamat itu)
    location ~ ^/console(/.*)?$ { return 302 https://console.adfsystem.store$1; }

    # ---- Larangan (sebelum blok PHP) ----
    location ~ /\. { deny all; }                                   # .git .htaccess .env …
    location ~ ^/(data|includes)(/|$) { deny all; }                # data/*.json & includes/ (Apache: Require all denied)
    location ~* \.(sql|gz|md|sh|ya?ml|lock|env|log|bak|ini)$ { deny all; }
    location ~ (^|/)(error_log|composer\.(json|lock|phar))$ { deny all; }
    location ~ (^|/)(diag|debug|test|fix|setup)-[^/]*\.php$ { deny all; }
    # uploads: tidak boleh ada skrip yang dijalankan
    location ~* ^/uploads/.*\.(php\d?|phtml|phar|pht|phps|cgi|pl|py|sh|asp|aspx|jsp)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 120;
    }
}
